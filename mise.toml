[tools]
go = "1.26.0"

[tasks.run]
run = "go run main.go"
description = "Run the proxy server"

[tasks.build]
run = "go build -o ./bin/grok-oauth-proxy ."
description = "Build the proxy binary"

[tasks.test]
run = "go test ./..."
description = "Run Go tests"

[tasks.publish]
run = "cd npm/ && npm publish"
description = "Publish the npm wrapper package in npm/"

[tasks.npm_publish]
run = "mise run publish"
description = "Alias for publish (kept for backwards compatibility)"
